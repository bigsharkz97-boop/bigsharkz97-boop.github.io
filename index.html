<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bigsharkz | AI Full-Stack Developer</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #050505;
  color: #f5f5f5;
  line-height: 1.6;
}

:root {
  --gold: #d4af37;
  --gold-light: #f5d76e;
  --dark: #050505;
  --card: #101010;
  --border: #252525;
  --muted: #aaa;
}

a {
  color: inherit;
  text-decoration: none;
}

.container {
  width: min(1100px, 92%);
  margin: auto;
}

/* NAVIGATION */
nav {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(5,5,5,.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.nav-inner {
  min-height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 1.5rem;
  font-weight: 900;
  letter-spacing: 2px;
  color: white;
}

.logo span {
  color: var(--gold);
}

.nav-links {
  display: flex;
  gap: 25px;
}

.nav-links a {
  color: #bbb;
  font-weight: 600;
  transition: .3s;
}

.nav-links a:hover {
  color: var(--gold);
}

.menu {
  display: none;
  background: transparent;
  border: 1px solid var(--border);
  color: white;
  font-size: 1.5rem;
  padding: 8px 12px;
  border-radius: 8px;
}

/* HERO */
.hero {
  min-height: 88vh;
  display: flex;
  align-items: center;
  background:
    radial-gradient(circle at 80% 20%, rgba(212,175,55,.13), transparent 30%),
    radial-gradient(circle at 10% 80%, rgba(212,175,55,.06), transparent 30%),
    #050505;
}

.badge {
  display: inline-block;
  padding: 8px 15px;
  border: 1px solid rgba(212,175,55,.5);
  border-radius: 999px;
  color: var(--gold-light);
  font-size: .85rem;
  margin-bottom: 22px;
}

.hero h1 {
  font-size: clamp(3rem, 10vw, 6.5rem);
  line-height: .95;
  max-width: 850px;
  letter-spacing: -3px;
}

.hero h1 span {
  color: var(--gold);
}
